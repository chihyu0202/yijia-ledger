<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1F6F63">
  <title>一家帳</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="一家帳">
  <!-- 改了 style.css／config.js／app.js：三個 ?v= 與 sw.js 的 VERSION 一起加 1 -->
  <link rel="stylesheet" href="style.css?v=5">
</head>
<body>
  <div id="offline" class="offline" hidden>目前離線，無法儲存</div>

  <!-- 載入中／登入 -->
  <section id="login" class="login" hidden>
    <h1>一家帳</h1>
    <p id="login-msg" class="login-msg"></p>
    <button id="login-btn" class="btn btn-primary" type="button">使用 Google 登入</button>
  </section>

  <div id="app" hidden>
    <main>
      <!-- 首頁：統計 -->
      <section id="tab-home" class="tab" hidden>
        <h2 class="tab-title">首頁</h2>
        <div id="home-controls" class="controls"></div>
        <div id="home-body"></div>
      </section>

      <!-- 新增／修改／複製 -->
      <section id="tab-add" class="tab" hidden>
        <h2 class="tab-title" id="form-title">新增</h2>
        <form id="expense-form" novalidate>
          <label class="field amount-field">
            <span class="label">金額</span>
            <span class="amount-wrap">
              <span class="currency">$</span>
              <input id="f-amount" name="amount" inputmode="decimal" autocomplete="off" placeholder="0">
            </span>
          </label>

          <label class="field">
            <span class="label">項目</span>
            <input id="f-item" name="item" maxlength="50" autocomplete="off" placeholder="例如：午餐">
          </label>

          <div class="field">
            <span class="label">歸屬</span>
            <div id="f-scope" class="chips" role="radiogroup" aria-label="歸屬"></div>
          </div>

          <div class="field">
            <span class="label">分類</span>
            <div id="f-category" class="chips" role="radiogroup" aria-label="分類"></div>
          </div>

          <label class="field">
            <span class="label">日期</span>
            <input id="f-date" name="expense_date" type="date">
          </label>

          <label class="field">
            <span class="label">備註</span>
            <textarea id="f-note" name="note" maxlength="200" rows="2" placeholder="選填"></textarea>
          </label>

          <p id="form-error" class="form-error" role="alert"></p>
          <button id="save-btn" class="btn btn-primary btn-block" type="submit">儲存</button>
          <button id="cancel-btn" class="btn btn-secondary btn-block mt" type="button" hidden>取消</button>
        </form>
      </section>

      <!-- 紀錄 -->
      <section id="tab-records" class="tab" hidden>
        <h2 class="tab-title">紀錄</h2>
        <div id="records-controls" class="controls"></div>
        <div id="records-body"></div>
      </section>

      <!-- 設定 -->
      <section id="tab-settings" class="tab" hidden>
        <h2 class="tab-title">設定</h2>
        <div id="settings-body"></div>
        <div class="card">
          <p>目前登入：<strong id="me-name"></strong></p>
          <button id="logout-btn" class="btn btn-secondary btn-block" type="button">登出</button>
        </div>
      </section>
    </main>

    <nav class="tabbar">
      <button type="button" data-tab="home">首頁</button>
      <button type="button" data-tab="add">新增</button>
      <button type="button" data-tab="records">紀錄</button>
      <button type="button" data-tab="settings">設定</button>
    </nav>
  </div>

  <!-- 底部面板 -->
  <div id="sheet" class="sheet-backdrop" hidden>
    <div class="sheet" role="dialog" aria-modal="true">
      <div id="sheet-body"></div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="config.js?v=5"></script>
  <script src="app.js?v=5"></script>
</body>
</html>
